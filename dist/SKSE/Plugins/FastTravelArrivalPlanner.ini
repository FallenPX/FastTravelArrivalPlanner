;! Fast Travel Arrival Planner - DEFAULT settings
;! Your own settings are kept in a separate file that updates never replace:
;!   Documents\My Games\Skyrim Special Edition\SKSE\FastTravelArrivalPlanner.ini
;!   (GOG version: ...\Skyrim Special Edition GOG\SKSE\FastTravelArrivalPlanner.ini)
;! The plugin creates it from this file the first time the game starts. After an update it
;! copies in any option the new version adds and takes out any option it no longer uses;
;! everything else stays as you set it. Edit that file, or use the settings page in SKSE
;! Menu Framework: once it exists, changes made in THIS file have no effect.
; Lines starting with ; are comments. 1 = on, 0 = off.
; With SKSE Menu Framework installed, its "Fast Travel Arrival Planner" page changes these
; options in the game and saves them here. After editing this file while the game runs,
; use that page's "Reload INI" button; otherwise changes take effect at the next start.

[General]
; 1 = clicking a destination on the world map opens the arrival panel.
; 0 = the game's own "Fast travel to ...?" box is used, as without this mod.
;     Use this if another interface mod conflicts with the panel.
bShowPanel = 1

; Instant, 1/3 and 1/2 are offered only when the normal travel time is at least this many
; game hours. 0 = no limit. Travel times grow with the timescale: at the default timescale
; of 20, a trip takes 2.5 times as many game hours as at a timescale of 8.
fMinHoursForFaster = 1.0

; When the map is opened from a conversation (some mods let you pick a destination on the
; map while talking to someone), leave that map to the game and the mod that opened it.
bSkipAfterConversation = 1

; How soon after a conversation ends a map still counts as "opened from a conversation",
; in real seconds.
fConversationSeconds = 2.0
