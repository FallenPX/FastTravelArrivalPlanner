;! Fast Travel Arrival Planner - DEFAULT settings
;! Your own settings are kept in a separate file that updates never replace:
;!   Documents\My Games\Skyrim Special Edition\SKSE\FastTravelArrivalPlanner.ini
;!   (GOG version: ...\Skyrim Special Edition GOG\SKSE\FastTravelArrivalPlanner.ini)
;! The plugin creates it from this file the first time the game starts, and copies in any
;! option a newer version adds. Edit that file: once it exists, changes made in THIS file
;! have no effect.
; Lines starting with ; are comments. 1 = on, 0 = off.
; Changes take effect the next time you start the game, or straight away with the
; "Reload INI" button on the planner's status page in SKSE Menu Framework.

[General]
; Master switch.
bEnabled = 1

; 1 = clicking a destination on the world map opens the arrival panel.
; 0 = the game's own "Fast travel to ...?" box is used, as without this mod.
;     Use this if another interface mod conflicts with the panel.
bShowPanel = 1

; Instant, 1/3 and 1/2 are offered only when the normal travel time is at least this many
; game hours. 0 = no limit.
fMinHoursForFaster = 1.0

; When the map is opened from a conversation (some mods let you pick a destination on the
; map while talking to someone), leave that map to the game and the mod that opened it.
bSkipAfterConversation = 1

; How soon after a conversation ends a map still counts as "opened from a conversation",
; in real seconds.
fConversationSeconds = 2.0

[Panel]
; 1 = the panel looks like the map's location flyout, whatever interface mod draws it:
;     its colours, font, text sizes and text shadow (read from the flyout while the game
;     runs), and Fast Travel Time Info's background settings (bShowBackground,
;     iBackgroundOpacity, iBackgroundCornerRadius). The font is used only if SKSE Menu
;     Framework has it; otherwise the framework's own font is used.
; 0 = the panel uses SKSE Menu Framework's own theme.
bMatchMapStyle = 1

; Font for the panel, by the name SKSE Menu Framework lists in its own font settings.
; Empty = the flyout's font when bMatchMapStyle = 1 (if the framework has it), otherwise
; the framework's font.
sFont = ""
